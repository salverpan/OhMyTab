<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>探头像素猫预览</title>
<link rel="stylesheet" href="../../dist/src/sidepanel/style.css">
<style>
  body { margin: 0; background: #f4f4f5; font-family: sans-serif; }
  .fake-chat {
    max-width: 420px; margin: 80px auto 0; background: var(--canvas, #fff);
    border: 1px solid #ddd; border-radius: 12px; overflow: hidden;
  }
  .fake-msg { padding: 14px 16px; font-size: 13.5px; color: #333; }
  #commandBar { background: #fff; }
  .peek-scale-note { text-align:center; color:#888; font-size:12px; margin-top:12px; }
</style>
</head>
<body>
  <div class="fake-chat">
    <div class="fake-msg">AI:你好,我是 Citecat~ 试试让我帮你采集资料。</div>
    <div id="commandBar" class="command-bar">
      <div class="cmd-input-wrap">
        <textarea id="cmdInput" rows="1" placeholder="戳戳 Citecat，说说想干嘛..."></textarea>
        <button id="cmdSendBtn" class="cmd-icon-btn send">▲</button>
      </div>
    </div>
  </div>
  <p class="peek-scale-note">↑ 猫应趴在输入框上沿,只露头+双爪</p>
  <script type="module">
    import { mountPeekCat, setPeekCatThinking } from '../src/sidepanel/pixel-cat.js';
    mountPeekCat(document.querySelector('#commandBar .cmd-input-wrap'));
    // 3 秒后切到"生成中"模式再切回,方便截图对比两种状态
    setTimeout(() => setPeekCatThinking(true), 3000);
    setTimeout(() => setPeekCatThinking(false), 7000);
  </script>
</body>
</html>
